[package]
name = "bundle-deepseek41"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
# The build compiles and locks SM120 cubins, so it lives in the sm120 module.
build = "src/sm120/build.rs"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
# Per-layer taps of prefills (`src/taps.rs`); never in a serving build.
diagnostic-taps = ["dep:serde_json"]

[dependencies]
serde_json = { workspace = true, optional = true }
bundle-runtime.workspace = true
frontend-format.workspace = true
kernel-build.workspace = true
kernel-core.workspace = true
kernels-sm120.workspace = true
model-deepseek41-contract.workspace = true
projection-spec.workspace = true
runtime-bundle-abi.workspace = true
runtime-bundle-sdk.workspace = true

[build-dependencies]
kernel-build.workspace = true
kernel-core.workspace = true
kernels-sm120.workspace = true
model-deepseek41-contract.workspace = true
projection-spec.workspace = true

[dev-dependencies]
bundle-runtime = { workspace = true, features = ["test-support"] }
encoder-spec.workspace = true
model-compiler-sdk.workspace = true
model-deepseek41 = { path = "../compiler" }
runtime-bundle.workspace = true
serde_json.workspace = true

# Tests that include the build script's registration files live under
# tests/sm120.
[[test]]
name = "projection_assembly"
path = "tests/sm120/projection_assembly.rs"

# Tests that name SM120 items live under tests/sm120 and keep their names.
[[test]]
name = "encoder_catalog_stability"
path = "tests/sm120/encoder_catalog_stability.rs"

[lints]
workspace = true
