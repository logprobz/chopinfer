[package]
name = "bundle-tp4-fixture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# The installable form of this fixture is a native module the host opens with
# the draft V1 C ABI, so the crate also builds as a shared object.
# `build-tp4-fixture` compiles that shared object and packages it beside the
# manifest it emits.
[lib]
crate-type = ["lib", "cdylib"]

[features]
# The macOS acceptance path names this feature on every crate it builds, so this
# fixture carries it. It enables CPU process-test controls; the crate links
# no device services or CUDA, which is what the dependency audit checks.
fake-host-services = []

# Emits the closed `chop-model-bundle-v1` directory this fixture installs from.
#
# The name carries the fixture, because one target directory holds one file per
# binary name and every other bundle emits its own package with a program of its
# own.
[[bin]]
name = "build-tp4-fixture"
path = "src/bin/build-tp4-fixture.rs"

[dependencies]
# The chat frontend this fixture's module exports.
frontend-format.workspace = true
# The transform identifiers the weight plan names.
kernel-core.workspace = true
# The emitter that stages, measures, and publishes the canonical directory.
model-compiler-sdk.workspace = true
# The canonical manifest records this fixture declares itself with.
runtime-bundle.workspace = true
runtime-bundle-abi.workspace = true
runtime-bundle-sdk.workspace = true
# For the digests this fixture declares over its own operation source and over
# the synthetic bytes it generates. It reads no checkpoint and computes no
# component digest: the emitter does that.
runtime-weights.workspace = true
# The served declaration and the fixture marker are JSON documents this crate
# builds. Writing them through a serializer is what keeps the declaration the
# transport parses and the declaration this crate intended the same document.
serde_json.workspace = true

[dev-dependencies]
# The engine the served acceptance test builds over this bundle, and the paged
# pool, schedule, and vocabulary it is sized from.
runtime-engine.workspace = true
runtime-kv.workspace = true
runtime-model-api.workspace = true
runtime-scheduler.workspace = true
# For the shared reader that has to build a tokenizer from the artifacts this
# crate generates, and for the declaration type it reads them against.
runtime-frontend.workspace = true
# The focused tests drive this fixture through the real host service layer over
# host memory, so the path they prove is the one an installed bundle takes.
runtime-host.workspace = true
# For the tier the declared operation resolves at, checked against the real
# host catalog rather than against this crate's own belief about it.
runtime-kernels.workspace = true
# The row this fixture emits is sampled by the shared sampler, so the width and
# the finiteness it claims are checked by the code that would consume them.
runtime-sampling.workspace = true
# The served half is the real transport, bound on a loopback port and asked to
# generate one token; it also carries the configuration type
# `deployment_from_package_v1` reads a whole deployment with.
runtime-server.workspace = true
runtime-tokenizer.workspace = true
serde_json.workspace = true
tokio.workspace = true

[lints]
workspace = true
