# Model inventory, checked by tests/bundle-boundary.sh (tests/model_inventory.py).
# Each role is the crate in the directory of that name. List every bin and
# cdylib target exactly; libraries are not listed.
schema = "chopinfer-model-inventory-v1"
# CPU CI reads CHOPINFER_DEEPSEEK_CHECKPOINT: deepseek-ai/DeepSeek-V4.1-Flash-1017
# at revision 1bae0e1088993b9b82de08f59de5be5a34e42170 (checkpoint-files.json).
checkpoint_env = "DEEPSEEK"
# The model author: the only publisher whose checkpoints the model's JSON
# names (check_publishers in tools/model_sdk/inventory.py).
publisher = "deepseek-ai"

[bundle]
package = "bundle-deepseek41"
cdylib = ["bundle_deepseek41"]

[compiler]
package = "model-deepseek41"
bin = ["chopinfer-model-deepseek41"]

[contract]
package = "model-deepseek41-contract"

# Not released until it passes its full qualification through the release
# preview.
[release]
enabled = false

# tests/model-geometry-recipe.sh: one `--ci` leg per fixture under
# fixtures/deepseek41/geometries/. The bundle builds and serves the added
# geometry, and the contract's kernel suites prepare its entries.
[geometry_recipe]
stage = "bundle"
fixtures = ["synthetic-small"]
architecture = "DeepseekV41GeometryRecipeForCausalLM"
contract_tests = ["kernel_compressor", "kernel_latent", "kernel_moe", "kernel_mxfp8_fold"]

[checks]
reference_tests = ["test_reference.py", "test_reference_kernel.py", "test_reference_workloads.py"]
